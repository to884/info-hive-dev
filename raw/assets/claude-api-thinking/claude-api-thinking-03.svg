<svg lang="en" width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Diagram of thinking on a model that strips previous thinking blocks: each turn's thinking block is generated in the output and not carried into later turns' input">
  <style>
    /* Type: the page's fonts when the page inlines this diagram; the listed fallbacks otherwise, for example in a code review */
    .sans { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); font-size: 12.8px; }
    .serif { font-family: var(--cds-font-voice, "Anthropic Serif", ui-serif, Georgia, "Times New Roman", serif); font-size: 11.8px; }
    /* Chinese, Japanese and Korean have no serif in the docs fonts, and browsers pick different serif fallbacks for them, so their serif labels use the sans fonts, like the page's sans text */
    .serif:is(:lang(ja), :lang(ko), :lang(zh)) { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); }
    .middle { text-anchor: middle; }
    /* Heavier text sets its weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .medium { font-weight: 500; font-variation-settings: var(--cds-font-wght-medium, normal); }
    .bold { font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    .side { font-size: 13.6px; }
    /* In Chinese, Japanese and Korean, rotated text is written top to bottom with upright characters instead. The shift of a third of the font size puts it about where the English rotated text is drawn. */
    .rotated:lang(ja), .rotated:lang(ko), .rotated:lang(zh) { writing-mode: vertical-rl; transform: translate(-0.33em); }
    .turn { font-size: 13px; }
    /* Colors: the docs theme's CSS variables when the page inlines this diagram; the light values otherwise */
    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .primary { fill: var(--cds-text-primary, #0b0b0b); }
    .muted { fill: var(--cds-text-muted, #898781); }
    .panel-input { fill: var(--cds-bg-tint-yellow-opaque, #f9dca4); fill-opacity: 0.75; }
    .panel-output { fill: var(--cds-alpha-2, #e4e4e3); }
    .block-user { fill: var(--cds-clay, #d97757); fill-opacity: 0.6; }
    .block-text { fill: var(--cds-chart-muted, #c3c2b7); }
    /* Black at 50% over a rect in the canvas color: one gray on every panel, and the darkest block in both themes, since the page says "thinking blocks (shown in dark gray)" */
    .block-thinking { fill: var(--cds-gray-900, #0b0b0b); fill-opacity: 0.5; }
    .brace { fill: none; stroke: var(--cds-text-muted, #898781); stroke-width: 1.7; stroke-linecap: round; }
    .brace-head { fill: var(--cds-text-muted, #898781); stroke: var(--cds-text-muted, #898781); stroke-width: 1.2; stroke-linejoin: round; }
    .dashed { fill: none; stroke: var(--cds-text-primary, #0b0b0b); stroke-width: 1; stroke-dasharray: 4 3; }
    /* Fades the boxes beyond the context window; the words on them are drawn after it, in the muted color */
    .veil { fill: var(--cds-surface-1, #fcfcfb); fill-opacity: 0.77; }
    .scissors { fill: var(--cds-text-primary, #0b0b0b); }
    .scissors-ring { fill: none; stroke: var(--cds-text-primary, #0b0b0b); stroke-width: 7; }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    /* Box labels: tighter lines and less padding above and below in the shortest boxes, so that a translation fits on two lines */
    .label.sans { line-height: 1.15; }
    .area.pad-y-2 { padding-top: 2px; padding-bottom: 2px; }
    .area.pad-right-0 { padding-right: 0; } /* no padding on the right, so that a translation has room before the dashed line */
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    .label .mono, .label .code { hyphens: none; overflow-wrap: normal; }
    /* Chinese, Japanese and Korean labels break lines only at spaces and punctuation, and at the zero-width spaces that the docs translator adds to Chinese and Japanese text */
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    /* Chinese, Japanese and Korean fonts have no italics, so the browser would slant the glyphs. This overrides the diagram's italic classes. */
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    .label.primary { color: var(--cds-text-primary, #0b0b0b); }
    .label.muted { color: var(--cds-text-muted, #898781); }
  </style>
