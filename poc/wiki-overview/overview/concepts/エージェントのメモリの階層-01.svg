<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif">
<title>メモリは 4 段の棚</title>
<rect width="720" height="500" rx="12" fill="#fafafa"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#242424">メモリは 4 段の棚</text>
<text x="24" y="62" font-size="13" fill="#616161">上の段ほど小さく、かならず目に入る。下の段ほど大きく、探したときだけ読まれる。</text>

<!-- 大きさの軸 -->
<g fill="#707070">
<text x="36" y="100" font-size="12" text-anchor="middle">小さい</text>
<text x="36" y="456" font-size="12" text-anchor="middle">大きい</text>
<polygon points="36,108 30,120 42,120"/>
<polygon points="36,436 30,424 42,424"/>
</g>
<line x1="36" y1="120" x2="36" y2="424" stroke="#707070" stroke-width="2"/>

<!-- 1 段目: 注入コンテキスト -->
<rect x="180" y="86" width="220" height="80" rx="10" fill="#0f6cbd"/>
<g transform="translate(198,110)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<path d="M0 0h32v22l-10 10H0z"/><path d="M32 22h-10v10"/>
</g>
<text x="306" y="122" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">毎回読むメモ</text>
<text x="306" y="146" font-size="13" fill="#ebf3fc" text-anchor="middle">注入コンテキスト</text>

<!-- 2 段目: メモリ表現 -->
<rect x="140" y="176" width="300" height="80" rx="10" fill="#2886de"/>
<g transform="translate(158,200)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<path d="M2 4h11a4 4 0 0 1 3 2a4 4 0 0 1 3-2h11v22H19a4 4 0 0 0-3 2a4 4 0 0 0-3-2H2z"/><path d="M16 6v22"/>
</g>
<text x="306" y="212" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">整理した事典（wiki など）</text>
<text x="306" y="236" font-size="13" fill="#ebf3fc" text-anchor="middle">メモリ表現</text>

<!-- 3 段目: メモリノート -->
<rect x="100" y="266" width="380" height="80" rx="10" fill="#b4d6fa"/>
<g transform="translate(118,290)" fill="none" stroke="#0f548c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<path d="M4 28l2-8L22 4l6 6L12 26z"/><path d="M19 7l6 6"/>
</g>
<text x="306" y="302" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">その場の走り書き</text>
<text x="306" y="326" font-size="13" fill="#424242" text-anchor="middle">メモリノート</text>

<!-- 4 段目: トランスクリプト -->
<rect x="60" y="356" width="460" height="80" rx="10" fill="#ebf3fc" stroke="#0f6cbd" stroke-width="1.5"/>
<g transform="translate(78,380)" fill="none" stroke="#0f548c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect x="0" y="2" width="32" height="28" rx="3"/><path d="M7 10h18M7 16h18M7 22h12"/>
</g>
<text x="306" y="392" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">会話の全記録</text>
<text x="306" y="416" font-size="13" fill="#424242" text-anchor="middle">トランスクリプト</text>

<!-- 読まれ方 -->
<g stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4">
<line x1="400" y1="126" x2="538" y2="126"/>
<line x1="440" y1="216" x2="538" y2="216"/>
<line x1="480" y1="306" x2="538" y2="306"/>
<line x1="520" y1="396" x2="538" y2="396"/>
</g>
<text x="548" y="96" font-size="12" fill="#707070">どう読まれるか</text>
<g font-size="14" font-weight="700" fill="#242424">
<text x="548" y="123">始まりに自動で届く</text>
<text x="548" y="213">必要なときに開く</text>
<text x="548" y="303">必要なときに開く</text>
<text x="548" y="393">検索して読む</text>
</g>
<g font-size="12" fill="#616161">
<text x="548" y="142">探さなくても読める</text>
<text x="548" y="232">リンクでつながったページ</text>
<text x="548" y="322">Claude が大事と見て書く</text>
<text x="548" y="412">ほかの段の答え合わせ</text>
</g>
<text x="24" y="480" font-size="13" fill="#616161">ここでいうメモリは、あとで読めるように保存した知識だけを指す。</text>
</svg>
