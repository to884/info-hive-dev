<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif">
<title>wiki は、検索と組み合わせると点数が上がる</title>
<rect width="720" height="380" rx="12" fill="#fafafa"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#242424">事典（wiki）は、検索と組み合わせると強い</text>
<text x="24" y="62" font-size="13" fill="#616161">評価の点数。複数の文書をまたぐ問い、判断や計算が要る問いで差が出た。</text>

<g font-size="15" fill="#242424">
<text x="24" y="107" font-weight="700">wiki ＋ 検索</text>
<text x="24" y="153">wiki だけ</text>
<text x="24" y="199">検索だけ</text>
</g>
<rect x="140" y="84" width="366" height="34" rx="6" fill="#0f6cbd"/>
<rect x="140" y="130" width="324" height="34" rx="6" fill="#c7c7c7"/>
<rect x="140" y="176" width="318" height="34" rx="6" fill="#c7c7c7"/>
<g font-size="18" font-weight="700">
<text x="516" y="108" fill="#0f6cbd">61%</text>
<text x="474" y="154" fill="#424242">54%</text>
<text x="468" y="200" fill="#424242">53%</text>
</g>
<text x="24" y="238" font-size="13" fill="#616161">1 つの文書の文字列検索で答えが見つかる問いでは、差が出なかった。</text>

<!-- 費用の主張 -->
<rect x="24" y="258" width="672" height="98" rx="8" fill="#ffffff" stroke="#d1d1d1"/>
<rect x="24" y="258" width="6" height="98" fill="#eaa300"/>
<text x="48" y="284" font-size="14" font-weight="700" fill="#242424">費用についての主張（未確認）</text>
<g font-size="13" fill="#424242">
<text x="48" y="310">wiki が一度できていれば、小さいモデルでも、検索する大きいモデルとの差は 1 ポイント以内。</text>
<text x="48" y="334">1 回答の価格は約 15 分の 1。約 240 問で、wiki を作る費用（約 19 ドル）の元が取れる。</text>
</g>
</svg>
