<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" font-family="'Segoe UI','Yu Gothic UI','Hiragino Sans','Noto Sans JP',sans-serif">
<title>ドリーミングは、セッションの外で棚を片付ける時間</title>
<rect width="720" height="540" rx="12" fill="#fafafa"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#242424">ドリーミングは、棚を片付ける時間</text>
<text x="24" y="62" font-size="13" fill="#616161">仕事の最中ではなく、セッションの外の時間に、記録を見直してメモリを整える。</text>

<!-- セッション中 -->
<rect x="24" y="84" width="176" height="120" rx="12" fill="#ffffff" stroke="#d1d1d1"/>
<g transform="translate(40,100)" stroke="#eaa300" stroke-width="2.5" stroke-linecap="round" fill="none">
<circle cx="16" cy="16" r="7" fill="#eaa300"/>
<path d="M16 1v4M16 27v4M1 16h4M27 16h4M5.4 5.4l2.8 2.8M23.8 23.8l2.8 2.8M5.4 26.6l2.8-2.8M23.8 8.2l2.8-2.8"/>
</g>
<text x="82" y="122" font-size="16" font-weight="700" fill="#242424">セッション中</text>
<text x="40" y="160" font-size="13" fill="#424242">仕事をしながら、</text>
<text x="40" y="181" font-size="13" fill="#424242">走り書きを残す</text>

<!-- ドリーミング -->
<rect x="272" y="84" width="176" height="120" rx="12" fill="#1b2a4a"/>
<circle cx="302" cy="116" r="14" fill="#ffd75e"/>
<circle cx="309" cy="110" r="12" fill="#1b2a4a"/>
<g fill="#ffd75e">
<circle cx="428" cy="100" r="2"/><circle cx="414" cy="112" r="1.5"/><circle cx="434" cy="122" r="1.5"/>
</g>
<text x="326" y="122" font-size="16" font-weight="700" fill="#ffffff">ドリーミング</text>
<text x="290" y="160" font-size="13" fill="#d6e4ff">記録を見直し、誤りを</text>
<text x="290" y="181" font-size="13" fill="#d6e4ff">直し、棚を片付ける</text>

<!-- 次のセッション -->
<rect x="520" y="84" width="176" height="120" rx="12" fill="#ffffff" stroke="#d1d1d1"/>
<g transform="translate(536,100)" fill="none" stroke="#0f6cbd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<circle cx="16" cy="16" r="14"/><path d="M13 9l8 7-8 7"/>
</g>
<text x="578" y="122" font-size="16" font-weight="700" fill="#242424">次のセッション</text>
<text x="536" y="160" font-size="13" fill="#424242">整ったメモを読んで</text>
<text x="536" y="181" font-size="13" fill="#424242">仕事を始める</text>

<!-- 矢印 -->
<g stroke="#616161" stroke-width="2">
<line x1="208" y1="158" x2="252" y2="158"/>
<line x1="456" y1="158" x2="500" y2="158"/>
</g>
<g fill="#616161">
<polygon points="264,158 252,152 252,164"/>
<polygon points="512,158 500,152 500,164"/>
</g>
<g font-size="12" fill="#424242" text-anchor="middle">
<text x="236" y="128">記録と</text>
<text x="236" y="144">走り書き</text>
<text x="484" y="128">整った</text>
<text x="484" y="144">メモ</text>
</g>

<!-- 5 つの仕事 -->
<text x="24" y="242" font-size="15" font-weight="700" fill="#242424">ドリーミングの 5 つの仕事</text>
<g fill="#ffffff" stroke="#d1d1d1">
<rect x="24" y="256" width="672" height="42" rx="8"/>
<rect x="24" y="304" width="672" height="42" rx="8"/>
<rect x="24" y="352" width="672" height="42" rx="8"/>
<rect x="24" y="400" width="672" height="42" rx="8"/>
<rect x="24" y="448" width="672" height="42" rx="8"/>
</g>
<g fill="#0f6cbd">
<circle cx="48" cy="277" r="12"/><circle cx="48" cy="325" r="12"/><circle cx="48" cy="373" r="12"/><circle cx="48" cy="421" r="12"/><circle cx="48" cy="469" r="12"/>
</g>
<g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
<text x="48" y="282">1</text><text x="48" y="330">2</text><text x="48" y="378">3</text><text x="48" y="426">4</text><text x="48" y="474">5</text>
</g>
<g font-size="15" font-weight="700" fill="#242424">
<text x="72" y="282">走り書きを直す</text>
<text x="72" y="330">事典を組み立てる</text>
<text x="72" y="378">上の段を小さく保つ</text>
<text x="72" y="426">目標に合わせる</text>
<text x="72" y="474">すき間を埋める</text>
</g>
<g font-size="13" fill="#424242">
<text x="236" y="282">全記録と照らして、最初からの誤りや古くなった内容を直す</text>
<text x="236" y="330">記録と走り書きから wiki を作り、足し、直し、刈り込む</text>
<text x="236" y="378">詳細は下の段へ移し、リンクだけを残す</text>
<text x="236" y="426">何が重要かを指示で伝え、それに向けてメモリを育てる</text>
<text x="236" y="474">複数の会話に共通する誤りを見つけ、切れたリンクを直す</text>
</g>
<text x="24" y="520" font-size="13" fill="#616161">人の脳が、眠りや休息の間に体験を再生して長期記憶に移すことになぞらえた呼び名。</text>
</svg>
