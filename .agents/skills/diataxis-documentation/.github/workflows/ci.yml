name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Validate the package
        run: python3 scripts/validate_package.py

      - name: Check manifest.txt for drift
        run: python3 scripts/update_manifest.py --check

      - name: Check the skill's own docs for health defects
        run: python3 scripts/docs_health.py assets/examples --fail-on error

      - name: Confirm the scripts have no third-party imports
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          local = {p.stem for p in pathlib.Path("scripts").glob("*.py")}
          bad = []
          for path in sorted(pathlib.Path("scripts").glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib and name not in local:
                          bad.append(f"{path}: {name}")
          if bad:
              print("Non-stdlib imports found:", *bad, sep="\n")
              raise SystemExit(1)
          print("All script imports are standard library or local.")
          PY

  spec-validate:
    name: Agent Skills reference validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The specification recommends validating with the reference
      # implementation as well as with the repository's own checks.
      - name: Install skills-ref
        run: cargo install skills-ref-rs --locked

      - name: Validate the package against the specification
        run: skills-ref validate .
