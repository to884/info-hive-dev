name: Wiki MCP server

# wiki の MCP サーバー（info-hive-wiki）を Linux で確かめる。Windows は手元で確かめる。
# - tests/wiki/test_wiki_lint.py: lint の索引、出典、原本、タグの検査（標準ライブラリだけ）
# - tests/wiki/test_source_claims.py: ソースの要約ページの「主張と行き先」の規定とひな形の整合（標準ライブラリだけ）
# - tests/wiki/test_template_script_paths.py: ひな形が書き出すコマンドのスクリプトのパスと、検索の例の実行（標準ライブラリだけ）
# - tests/wiki/test_wiki_fetch.py: Web ページの取得の <picture> の図と <pre> の <br>（標準ライブラリだけ、ネットにつながない）
# - tests/wiki/test_graph_duplicate_slugs.py: 同じスラッグと同じノード ID のページのグラフの抽出（PyYAML が要る）
# - tests/wiki/test_graph_lint_edge_refs.py: グラフの lint が contradicts と supersedes のエッジの ID を認めること（PyYAML が要る）
# - tests/wiki/test_graph_frontmatter_values.py: グラフの抽出が読む frontmatter の値が lint と同じこと（PyYAML が要る）
# - tests/wiki/test_frontmatter_parser.py と test_frontmatter_raw.py: frontmatter のパーサーが読む YAML の書き方（PyYAML が要る）
# - tests/wiki/test_mcp_spawn_flags.py: 入口、中継、サーバーの子プロセスの起動の旗（標準ライブラリだけ）
# - tests/wiki/test_wiki_index.py と test_mcp_server.py: テスト用の埋め込みで、索引、中継、サーバーの起動と停止
# - tests/wiki/run_mcp_gate.py: 本物のモデル（約 530 MB）を取得して、評価ゲートを ADR-0011 の融合の設定で通す
#
# info-hive-wiki は、シークレット WIKI_READ_TOKEN の読み取り専用のトークンで取得する
# （fine-grained PAT、対象は to884/info-hive-wiki、権限は Contents の Read-only）。
# info-hive-wiki はパブリックになったが、トークンを使う作りは残す。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - info-hive-wiki
      - tests/wiki/**
      - poc/poc_data.py
      - .github/workflows/wiki-mcp.yml

permissions:
  contents: read

concurrency:
  group: wiki-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      DEPS: >-
        --with mcp==1.30.0 --with numpy==2.5.4 --with usearch==2.26.6 --with tantivy==0.27.0
        --with fastembed==0.8.0 --with onnxruntime==1.31.1 --with pyyaml==6.0.3 --with psutil==7.2.2
    steps:
      - uses: actions/checkout@v4
      - name: info-hive-wiki の参照を調べる
        id: wiki
        env:
          WIKI_READ_TOKEN: ${{ secrets.WIKI_READ_TOKEN }}
        run: |
          if [ -z "$WIKI_READ_TOKEN" ]; then
            echo "::error::シークレット WIKI_READ_TOKEN がない。to884/info-hive-wiki を読める fine-grained PAT を置く"
            exit 1
          fi
          echo "sha=$(git ls-tree HEAD info-hive-wiki | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - id: checkout-wiki
        uses: actions/checkout@v4
        with:
          repository: to884/info-hive-wiki
          ref: ${{ steps.wiki.outputs.sha }}
          path: info-hive-wiki
          token: ${{ secrets.WIKI_READ_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: 環境を記録する
        run: |
          uname -a
          uv --version
          uv run --python 3.12 python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      # 前の試験が失敗しても続けて動かす。wiki を取得できなかったときは動かさない。
      - name: lint の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 python -X utf8 -m unittest tests/wiki/test_wiki_lint.py -v
      - name: 主張と行き先の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 python -X utf8 -m unittest tests/wiki/test_source_claims.py -v
      - name: ひな形のスクリプトのパスの試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 python -X utf8 -m unittest tests/wiki/test_template_script_paths.py -v
      - name: Web ページの取得の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 python -X utf8 -m unittest tests/wiki/test_wiki_fetch.py -v
      # markdown-it-py はプラグインに同梱している。グラフの比較には PyYAML が要る。
      - name: ページの集合とリンクの規則の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 --with pyyaml==6.0.3 python -X utf8 -m unittest tests/wiki/test_page_set.py -v
      - name: 同じスラッグと同じノード ID のページのグラフの試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 --with pyyaml==6.0.3 python -X utf8 -m unittest tests/wiki/test_graph_duplicate_slugs.py -v
      - name: グラフの lint のエッジの ID の参照の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 --with pyyaml==6.0.3 python -X utf8 -m unittest tests/wiki/test_graph_lint_edge_refs.py -v
      - name: グラフが読む frontmatter の値の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 --with pyyaml==6.0.3 python -X utf8 -m unittest tests/wiki/test_graph_frontmatter_values.py -v
      - name: frontmatter のパーサーが読む YAML の書き方の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 --with pyyaml==6.0.3 python -X utf8 -m unittest tests/wiki/test_frontmatter_parser.py tests/wiki/test_frontmatter_raw.py -v
      - name: 索引の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 $DEPS python -X utf8 -m unittest tests/wiki/test_wiki_index.py -v
      - name: 子プロセスの起動の旗の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 python -X utf8 -m unittest tests/wiki/test_mcp_spawn_flags.py -v
      - name: サーバーと中継の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python 3.12 $DEPS python -X utf8 -m unittest tests/wiki/test_mcp_server.py -v
      - name: 本物のモデルで評価ゲートを通す
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        env:
          INFO_HIVE_POC_DATA: ${{ runner.temp }}/poc
        run: uv run --python 3.12 $DEPS python -X utf8 tests/wiki/run_mcp_gate.py --fusion adr-0011
      - name: 結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wiki-mcp-${{ matrix.os }}
          path: |
            docs/research/wiki-mcp-server-2026-11-06/gate.json
            ${{ runner.temp }}/poc/wiki-mcp-20261106/data/logs/
          if-no-files-found: ignore
