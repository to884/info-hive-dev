name: Wiki walk

# wiki をたどる経路（info-hive-wiki の wiki_pages.walk_markdown、wiki 0.10.2）を、Windows、macOS、Linux と、
# Python 3.10 と 3.12 で確かめる。設計は docs/plans/wiki-walk-excluded-dirs-2026-11-11.md にある。
# - tests/wiki/test_walk.py: 木から計算した答え、今（0.10.1）の実装との照合、失敗を入れる探索と対照、口の一覧
# - tests/wiki/test_page_set.py、test_wiki_lint.py: ページの集合と lint の今ある試験
#
# test_walk.py は、今の実装を info-hive-wiki のコミット 2756a4e から git で取り出すので、info-hive-wiki の履歴を
# すべて取得する（fetch-depth: 0）。info-hive-wiki は、シークレット WIKI_READ_TOKEN の読み取り専用のトークンで取得する。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - info-hive-wiki
      - tests/wiki/test_walk.py
      - tests/wiki/test_page_set.py
      - tests/wiki/test_wiki_lint.py
      - .github/workflows/wiki-walk.yml

permissions:
  contents: read

concurrency:
  group: wiki-walk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: info-hive-wiki の参照を調べる
        id: wiki
        env:
          WIKI_READ_TOKEN: ${{ secrets.WIKI_READ_TOKEN }}
        run: |
          if [ -z "$WIKI_READ_TOKEN" ]; then
            echo "::error::シークレット WIKI_READ_TOKEN がない。to884/info-hive-wiki を読める fine-grained PAT を置く"
            exit 1
          fi
          echo "sha=$(git ls-tree HEAD info-hive-wiki | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - id: checkout-wiki
        uses: actions/checkout@v4
        with:
          repository: to884/info-hive-wiki
          ref: ${{ steps.wiki.outputs.sha }}
          path: info-hive-wiki
          token: ${{ secrets.WIKI_READ_TOKEN }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: 環境を記録する
        run: uv run --python ${{ matrix.python }} python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - name: 走査の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python ${{ matrix.python }} python -X utf8 -B -m unittest tests/wiki/test_walk.py -v
      - name: ページの集合と lint の試験
        if: ${{ !cancelled() && steps.checkout-wiki.outcome == 'success' }}
        run: uv run --python ${{ matrix.python }} python -X utf8 -B -m unittest tests/wiki/test_page_set.py tests/wiki/test_wiki_lint.py -v
